[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "security-design-auditor"
version = "0.1.0"
description = "Skill-driven design requirements and static security analysis"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "google-adk==2.9.1", "litellm==1.101.0", "pyyaml==6.0.3",
  "tree-sitter==0.26.0", "tree-sitter-python==0.25.0", "tree-sitter-java==0.23.5",
  "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2", "tree-sitter-c==0.24.2",
  "tree-sitter-go==0.25.0"
]

[project.optional-dependencies]
documents = ["docling>=2.50,<3"]
standards = ["pdfplumber==0.11.9", "pypdfium2==5.14.0"]
embeddings = ["torch==2.14.1", "transformers==5.18.0"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
auditor = "security_auditor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/security_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["src/security_auditor/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
